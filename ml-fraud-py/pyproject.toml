[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "1.0.0"
description = "Training and Kafka inference service for automotive fraud risk"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "kafka-python>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "xlrd>=2,<3",
]

[project.scripts]
fraud-ml = "fraud_detection.cli:main"

[tool.setuptools.packages.find]
include = ["fraud_detection*"]

[tool.ruff]
line-length = 100
target-version = "py311"
